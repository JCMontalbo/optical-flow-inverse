[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ofi"
version = "0.1.0"
description = "Optical flow as an inverse problem: variational estimation and forward propagation of image information"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "John Montalbo" }]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.7"]

[tool.setuptools]
packages = ["ofi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
